<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Subtitles Overlay</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
    }

    #subtitle {
      position: absolute;
      bottom: 10%;
      width: 100%;
      text-align: center;
      font-size: 2.5em;
      color: white;
      font-family: Arial, sans-serif;
      text-shadow: 2px 2px 4px #000;
      opacity: 1;
      transition: opacity 0.4s ease-out; /* smooth fade-out */
      min-height: 1em; /* prevent layout jump when empty */
    }
  </style>
</head>
<body>
  <div id="subtitle">Waiting to display...</div>

  <script src="https://cdn.socket.io/4.4.1/socket.io.min.js"></script>
  <script>
    const socket = io("http://localhost:5100", {
      transports: ["websocket"],
      reconnection: true,
    });

    const el = document.getElementById("subtitle");
    let fadeTimeout = null;

    socket.on("connect", () => {
      console.log("✅ Connected to socket.io server");
    });

    socket.on("subtitle", function (data) {
      // Avoid unnecessary updates
      if (el.innerText !== data.text) {
        console.log("🗨️ Subtitle updated:", data.text);

        // Clear previous fade-out if any
        if (fadeTimeout) {
          clearTimeout(fadeTimeout);
          fadeTimeout = null;
        }

        if (data.text === "") {
          // Fade out smoothly
          el.style.opacity = 0;
          fadeTimeout = setTimeout(() => {
            el.innerText = "";
          }, 400); // matches CSS transition
        } else {
          // Update text and ensure opacity is 1
          el.innerText = data.text;
          el.style.opacity = 1;
        }
      }
    });

    socket.on("style_update", function (data) {
      el.style.fontFamily = data.font;
      el.style.fontSize = data.size + "px";
      el.style.maxWidth = `${data.wraplength}px`;
      el.style.opacity = Math.min(data.opacity, 1);

      // Handle subtitle background toggle
      if (data.box_background) {
        el.style.backgroundColor = "rgba(0,0,0,0.5)";
        el.style.borderRadius = "8px";
        el.style.padding = "8px 16px";
        el.style.display = "inline-block";
      } else {
        el.style.backgroundColor = "transparent";
        el.style.borderRadius = "0px";
        el.style.padding = "0px";
        el.style.display = "block";
      }

      if (data.font_color) {
        el.style.color = data.font_color;
      }
    });

    socket.on("disconnect", () => {
      console.log("❌ Disconnected from socket.io server");
    });
  </script>
</body>
</html>
